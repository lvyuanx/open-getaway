user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_http_version 1.1;
    # Docker's embedded DNS resolver. Service templates use a variable in
    # proxy_pass so recreated containers can receive a new IP without a
    # gateway restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Keep an explicit health endpoint and a safe response for unmatched hosts.
    server {
        listen 80 default_server;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    # Files copied to nginx/conf.d/*.conf are loaded here at runtime.
    include /etc/nginx/conf.d/*.conf;
}
