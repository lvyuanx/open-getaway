<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>404 | Route not found</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="page">
    <header class="topbar">
        <div class="brand"><span class="brand-mark">OG</span><span>OPEN-GETAWAY</span></div>
        <span class="route">Gateway response / 404</span>
    </header>

    <main class="main error-main">
        <section class="error-hero" aria-labelledby="page-title">
            <p class="code" aria-label="Error 404">404</p>
            <div>
                <p class="eyebrow">Route not found</p>
                <h1 id="page-title">Nothing routes <em>here.</em></h1>
                <p class="lede">The gateway is online, but this path does not match a configured service or resource.</p>
                <a class="error-link" href="/">Return to gateway</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>Open-Getaway gateway</span>
        <span>request not mapped</span>
    </footer>
</div>
</body>
</html>
