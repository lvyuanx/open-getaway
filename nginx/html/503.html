<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>503 | Temporarily unavailable</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="temporary">
<div class="page">
    <header class="topbar">
        <div class="brand"><span class="brand-mark">OG</span><span>OPEN-GETAWAY</span></div>
        <span class="route">Gateway response / 503</span>
    </header>

    <main class="main error-main">
        <section class="error-hero" aria-labelledby="page-title">
            <p class="code" aria-label="Error 503">503</p>
            <div>
                <p class="eyebrow">Service unavailable</p>
                <h1 id="page-title">The route needs <em>a moment.</em></h1>
                <p class="lede">The gateway is reachable, but the requested service is temporarily unavailable. Please try again shortly.</p>
                <a class="error-link" href="/">Return to gateway</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>Open-Getaway gateway</span>
        <span>temporary service state</span>
    </footer>
</div>
</body>
</html>
